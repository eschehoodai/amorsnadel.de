name: Deploy to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4
      
    - name: Node.js einrichten
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Abhängigkeiten installieren
      run: npm install

    - name: Projekt bauen (Build)
      run: npm run build

    - name: FTP-Upload zu Netcup
      env:
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y lftp
        lftp -c "set ftp:ssl-allow true; set ftp:ssl-force true; set ssl:verify-certificate no; open -u '${{ secrets.FTP_USERNAME }}','$FTP_PASSWORD' '${{ secrets.FTP_SERVER }}'; mirror -R -v ./dist/ /amorsnadel.de/httpdocs/"
